<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kōnane Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ks-navy:    #002147;
    --ks-blue:    #004FA3;
    --ks-gold:    #C8960C;
    --ks-gold-lt: #F0C842;
    --ks-white:   #FFFFFF;
    --ks-silver:  #B0B8C1;
    --ks-bg:      #001633;
    --row-odd:  rgba(255,255,255,0.04);
    --row-even: rgba(255,255,255,0.00);
    --border:   rgba(255,255,255,0.10);
  }

  html, body {
    height: 100%;
    font-family: 'Lexend', sans-serif;
    background: var(--ks-bg);
    color: var(--ks-white);
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,79,163,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 110%, rgba(200,150,12,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,21,51,0.6);
    backdrop-filter: blur(8px);
  }

  .header-titles h2 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ks-white);
    line-height: 1.1;
  }

  .header-right { text-align: right; }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(200,150,12,0.15);
    border: 1px solid rgba(200,150,12,0.4);
    border-radius: 99px;
    padding: 5px 14px 5px 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ks-gold-lt);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4cdb7a;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #last-updated {
    font-size: 12px;
    color: var(--ks-silver);
    font-weight: 300;
  }

  .table-section {
    position: relative;
    z-index: 1;
    padding: 32px 48px 40px;
    flex: 1;
  }

  .lb-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .lb-table thead tr {
    background: rgba(0,79,163,0.3);
    border-bottom: 1px solid var(--border);
  }

  .lb-table th {
    padding: 11px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ks-silver);
    text-align: left;
  }

  .lb-table th.center,
  .lb-table td.center { text-align: center; }

  .lb-table th.right,
  .lb-table td.right { text-align: right; }

  .lb-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
  }

  .lb-table tbody tr:nth-child(odd) { background: var(--row-odd); }
  .lb-table tbody tr:last-child { border-bottom: none; }
  .lb-table tbody tr:hover { background: rgba(0,79,163,0.15); }

  .lb-table td {
    padding: 8px 16px;
    font-weight: 400;
    color: var(--ks-white);
  }

  .rank-cell {
    font-size: 20px;
    font-weight: 600;
    color: var(--ks-silver);
    width: 1%;
    white-space: nowrap;
    vertical-align: middle;
  }

  .name-cell {
    position: relative;
    cursor: default;
    vertical-align: middle;
    line-height: 1.15;
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .name-cell.tier-1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--ks-gold-lt);
    letter-spacing: -0.01em;
    text-shadow: 0 0 18px rgba(240,200,66,0.7), 0 0 40px rgba(200,150,12,0.4);
  }

  .name-cell.tier-2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--ks-white);
  }

  .name-cell.tier-3 {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
  }

  .name-cell.tier-4 {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
  }

  .record-cell {
    color: var(--ks-silver);
    font-size: 20px;
    font-weight: 600;
    vertical-align: middle;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }

  .record-cell.undefeated { color: var(--ks-gold-lt); font-weight: 700; }
  .record-cell.winning    { color: #7EC8A0; }
  .record-cell.even       { color: var(--ks-silver); }
  .record-cell.losing     { color: #C89090; }

  #loading-state {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 80px 0;
    color: var(--ks-silver);
    font-weight: 300;
    font-size: 15px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--ks-gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error-state {
    position: relative;
    z-index: 1;
    display: none;
    text-align: center;
    padding: 60px 0;
    color: #F09595;
    font-size: 14px;
  }

  #error-state strong {
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
    color: #F7C1C1;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 14px 48px;
    border-top: 1px solid var(--border);
    background: rgba(0,21,51,0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    font-weight: 300;
  }

  #refresh-btn {
    background: rgba(0,79,163,0.3);
    border: 1px solid rgba(0,79,163,0.5);
    color: var(--ks-white);
    padding: 6px 16px;
    border-radius: 99px;
    font-family: 'Lexend', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.05em;
  }

  #refresh-btn:hover { background: rgba(0,79,163,0.55); }

  .hidden { display: none !important; }

  /* Tooltip */
  .tooltip {
    display: none;
    position: fixed;
    z-index: 100;
    background: #0a1f3a;
    border: 1px solid rgba(0,79,163,0.6);
    border-radius: 10px;
    padding: 14px 16px;
    min-width: 220px;
    max-width: 300px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .tooltip.visible { display: block; }

  .tooltip-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ks-white);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .tooltip-section { margin-bottom: 8px; }
  .tooltip-section:last-child { margin-bottom: 0; }
  .tooltip-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .tooltip-label.wins   { color: var(--ks-gold-lt); }
  .tooltip-label.losses { color: #C89090; }
  .tooltip-names {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.8);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="tooltip" class="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div id="tt-body"></div>
</div>

<header>
  <div class="header-titles">
    <h2>Kōnane Leaderboard</h2>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span>Live</div>
    <div id="last-updated">Fetching data…</div>
  </div>
</header>

<div id="loading-state">
  <div class="spinner"></div>
  Loading leaderboard…
</div>

<div id="error-state">
  <strong>Could not load leaderboard data</strong>
  Check your connection or verify the spreadsheet is published publicly.
</div>

<div id="content" class="hidden">
  <div class="table-section">
    <table class="lb-table">
      <thead>
        <tr>
          <th class="center">Rank</th>
          <th>Inoa</th>
          <th class="right">Record</th>
        </tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>
</div>

<footer>
  <span></span>
  <button id="refresh-btn">↺ Refresh</button>
</footer>

<script>
const SHEET_ID    = '1CWtdB_1y4bSB9yZgXFqTV1yB_TKbzXcBKLIR7ANXPO4';
const GID         = '319645049';
const GID_MATCHES = '0';

let matchMap = {};

const COL_NAME   = 0;
const COL_WINS   = 1;
const COL_LOSSES = 2;
const COL_RECORD = 3;

function formatTime(d) {
  return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', second:'2-digit' });
}

function assignTiers(rows) {
  if (!rows.length) return [];
  const scores = rows.map(r => parseFloat(String(r[COL_WINS])) || 0);
  const max = Math.max(...scores);
  const min = Math.min(...scores);
  const range = max - min;
  return rows.map((row, i) => {
    const wins = scores[i];
    const norm = range > 0 ? (wins - min) / range : 1;
    let tier;
    if (norm >= 0.90)      tier = 1;
    else if (norm >= 0.70) tier = 2;
    else if (norm >= 0.45) tier = 3;
    else if (norm >= 0.20) tier = 4;
    else                   tier = 5;
    return { row, tier, wins };
  });
}

function recordClass(wins, losses) {
  if (losses === 0 && wins > 0) return 'undefeated';
  if (wins > losses) return 'winning';
  if (wins === losses) return 'even';
  return 'losing';
}

function buildTable(rows) {
  const tiered = assignTiers(rows);
  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = '';

  const rankMap = [];
  let tierRank = 1;
  tiered.forEach(({ row }, i) => {
    if (i === 0) {
      rankMap.push(tierRank);
    } else {
      const prev = tiered[i - 1].row;
      const sameWins   = (parseFloat(String(row[COL_WINS]))   || 0) === (parseFloat(String(prev[COL_WINS]))   || 0);
      const sameLosses = (parseFloat(String(row[COL_LOSSES])) || 0) === (parseFloat(String(prev[COL_LOSSES])) || 0);
      if (!sameWins || !sameLosses) tierRank++;
      rankMap.push(tierRank);
    }
  });

  tiered.forEach(({ row, tier }, i) => {
    const rank   = rankMap[i];
    const wins   = parseFloat(String(row[COL_WINS]))   || 0;
    const losses = parseFloat(String(row[COL_LOSSES])) || 0;
    const recClass = recordClass(wins, losses);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="center rank-cell">${rank}</td>
      <td class="name-cell tier-${tier}">${row[COL_NAME]}</td>
      <td class="right record-cell ${recClass}">${row[COL_RECORD]}</td>
    `;
    const nameCell = tr.querySelector('.name-cell');
    nameCell.addEventListener('mouseenter', e => showTooltip(row[COL_NAME], e));
    nameCell.addEventListener('mouseleave', hideTooltip);
    tbody.appendChild(tr);
  });
}

function showError(msg) {
  document.getElementById('loading-state').classList.add('hidden');
  const error = document.getElementById('error-state');
  error.style.display = 'block';
  error.innerHTML = `<strong>Could not load leaderboard data</strong>${msg}`;
  document.getElementById('last-updated').textContent = 'Last attempt: ' + formatTime(new Date());
}

// ── Tooltip ───────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
const ttName  = document.getElementById('tt-name');
const ttBody  = document.getElementById('tt-body');

document.addEventListener('mousemove', e => {
  if (!tooltip.classList.contains('visible')) return;
  const pad = 16;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  if (x + 320 > window.innerWidth)  x = e.clientX - 320 - pad;
  if (y + 200 > window.innerHeight) y = e.clientY - 200 - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
});

function isTouchDevice() {
  return window.matchMedia('(hover: none)').matches;
}

function showTooltip(name) {
  if (isTouchDevice()) return;
  const data = matchMap[name];
  if (!data) return;
  ttName.textContent = name;
  ttBody.innerHTML = '';

  const totalMatches = data.wins.size + data.losses.size;
  const winPct = totalMatches > 0 ? Math.round((data.wins.size / totalMatches) * 100) : 0;
  const pctEl = document.createElement('div');
  pctEl.style.cssText = 'font-size:11px;font-weight:500;color:var(--ks-silver);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.1);letter-spacing:0.05em;';
  pctEl.textContent = `Win%: ${winPct}%`;
  ttBody.appendChild(pctEl);

  if (data.wins.size > 0) {
    const sec = document.createElement('div');
    sec.className = 'tooltip-section';
    sec.innerHTML = `<div class="tooltip-label wins">Wins</div>
      <div class="tooltip-names">${[...data.wins].join('<br>')}</div>`;
    ttBody.appendChild(sec);
  }
  if (data.losses.size > 0) {
    const sec = document.createElement('div');
    sec.className = 'tooltip-section';
    sec.innerHTML = `<div class="tooltip-label losses">Losses</div>
      <div class="tooltip-names">${[...data.losses].join('<br>')}</div>`;
    ttBody.appendChild(sec);
  }
  tooltip.classList.add('visible');
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ── Match sheet loader ────────────────────────────────────
const MC_NAME      = 1;
const MC_RESULT    = 3;
const MC_OPPONENT  = 4;
const MC_TIMESTAMP = 5;

function loadMatches(callback) {
  const cbName = 'matchCallback_' + Date.now();
  const timer = setTimeout(() => { delete window[cbName]; callback(); }, 8000);
  window[cbName] = function(response) {
    clearTimeout(timer);
    delete window[cbName];
    try {
      matchMap = {};
      const seen = new Set();
      response.table.rows.forEach(r => {
        const cells     = r.c.map(cell => cell ? (cell.f !== undefined ? cell.f : cell.v) : '');
        const name      = String(cells[MC_NAME]      || '').trim();
        const result    = String(cells[MC_RESULT]    || '').trim().toUpperCase();
        const opponent  = String(cells[MC_OPPONENT]  || '').trim();
        const timestamp = String(cells[MC_TIMESTAMP] || '').trim();
        if (!name || !opponent || (result !== 'W' && result !== 'L')) return;
        const key = `${name}|${opponent}|${timestamp}|${result}`;
        if (seen.has(key)) return;
        seen.add(key);
        if (!matchMap[name]) matchMap[name] = { wins: new Set(), losses: new Set() };
        if (result === 'W') matchMap[name].wins.add(opponent);
        else                matchMap[name].losses.add(opponent);
      });
    } catch(e) { /* silently fall back */ }
    callback();
  };
  const script = document.createElement('script');
  script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID_MATCHES}&tqx=out:json;responseHandler:${cbName}`;
  script.onerror = () => { clearTimeout(timer); delete window[cbName]; callback(); };
  document.head.appendChild(script);
}

// ── Main ──────────────────────────────────────────────────
function loadLeaderboard() {
  const loading = document.getElementById('loading-state');
  const error   = document.getElementById('error-state');
  const content = document.getElementById('content');
  const updated = document.getElementById('last-updated');
  loading.classList.remove('hidden');
  error.style.display = 'none';
  content.classList.add('hidden');
  loadMatches(() => loadStandings(loading, error, content, updated));
}

function loadStandings(loading, error, content, updated) {
  const cbName = 'gsCallback_' + Date.now();
  const timer = setTimeout(() => {
    delete window[cbName];
    showError('Request timed out. Check that the sheet is published publicly.');
  }, 10000);
  window[cbName] = function(response) {
    clearTimeout(timer);
    delete window[cbName];
    try {
      if (response.status === 'error') throw new Error(response.errors?.[0]?.detailed_message || 'Sheet error');
      const rows = response.table.rows
        .map(r => r.c.map(cell => cell ? (cell.f !== undefined ? cell.f : cell.v) : ''))
        .filter(r => r[COL_NAME] && String(r[COL_NAME]).trim() !== '');
      rows.sort((a, b) => {
        const aw = parseFloat(String(a[COL_WINS]))   || 0;
        const bw = parseFloat(String(b[COL_WINS]))   || 0;
        if (bw !== aw) return bw - aw;
        const al = parseFloat(String(a[COL_LOSSES])) || 0;
        const bl = parseFloat(String(b[COL_LOSSES])) || 0;
        return al - bl;
      });
      buildTable(rows);
      loading.classList.add('hidden');
      content.classList.remove('hidden');
      updated.textContent = 'Updated ' + formatTime(new Date());
    } catch(e) {
      showError(e.message);
    }
  };
  const script = document.createElement('script');
  script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json;responseHandler:${cbName}`;
  script.onerror = () => { clearTimeout(timer); showError('Failed to reach Google Sheets.'); };
  document.head.appendChild(script);
}

document.getElementById('refresh-btn').addEventListener('click', loadLeaderboard);
loadLeaderboard();
</script>
</body>
</html>
