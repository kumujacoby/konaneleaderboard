<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kōnane Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ks-navy:    #002147;
    --ks-blue:    #004FA3;
    --ks-gold:    #C8960C;
    --ks-gold-lt: #F0C842;
    --ks-white:   #FFFFFF;
    --ks-silver:  #B0B8C1;
    --ks-bg:      #001633;
    --row-odd:  rgba(255,255,255,0.04);
    --row-even: rgba(255,255,255,0.00);
    --border:   rgba(255,255,255,0.10);
  }

  html, body {
    height: 100%;
    font-family: 'Lexend', sans-serif;
    background: var(--ks-bg);
    color: var(--ks-white);
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,79,163,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 110%, rgba(200,150,12,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,21,51,0.6);
    backdrop-filter: blur(8px);
  }

  .header-titles h2 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ks-white);
    line-height: 1.1;
  }

  .header-right {
    text-align: right;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(200,150,12,0.15);
    border: 1px solid rgba(200,150,12,0.4);
    border-radius: 99px;
    padding: 5px 14px 5px 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ks-gold-lt);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4cdb7a;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #last-updated {
    font-size: 12px;
    color: var(--ks-silver);
    font-weight: 300;
  }

  .table-section {
    position: relative;
    z-index: 1;
    padding: 32px 48px 40px;
    flex: 1;
  }

  .table-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ks-silver);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .lb-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .lb-table thead tr {
    background: rgba(0,79,163,0.3);
    border-bottom: 1px solid var(--border);
  }

  .lb-table th {
    padding: 11px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ks-silver);
    text-align: left;
  }

  .lb-table th.center,
  .lb-table td.center { text-align: center; }

  .lb-table th.right,
  .lb-table td.right { text-align: right; }

  .lb-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
  }

  .lb-table tbody tr:nth-child(odd) { background: var(--row-odd); }
  .lb-table tbody tr:last-child { border-bottom: none; }
  .lb-table tbody tr:hover { background: rgba(0,79,163,0.15); }

  .lb-table td {
    padding: 8px 16px;
    font-weight: 400;
    color: var(--ks-white);
  }

  .rank-cell {
    font-size: 12px;
    font-weight: 500;
    color: var(--ks-silver);
    min-width: 36px;
    vertical-align: middle;
  }

  /* Banzuke-style name scaling — 5 tiers */
  .name-cell {
    vertical-align: middle;
    line-height: 1.15;
    /* default / lowest tier */
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .name-cell.tier-1 { /* top record */
    font-size: 22px;
    font-weight: 800;
    color: var(--ks-gold-lt);
    letter-spacing: -0.01em;
  }

  .name-cell.tier-2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--ks-white);
  }

  .name-cell.tier-3 {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
  }

  .name-cell.tier-4 {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
  }

  /* tier-5 is the default .name-cell */

  .record-cell {
    color: var(--ks-silver);
    font-size: 13px;
    vertical-align: middle;
    white-space: nowrap;
  }

  /* Color-code record by win/loss ratio */
  .record-cell.undefeated { color: var(--ks-gold-lt); font-weight: 600; }
  .record-cell.winning    { color: #7EC8A0; }
  .record-cell.even       { color: var(--ks-silver); }
  .record-cell.losing     { color: #C89090; }

  #loading-state {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 80px 0;
    color: var(--ks-silver);
    font-weight: 300;
    font-size: 15px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--ks-gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error-state {
    position: relative;
    z-index: 1;
    display: none;
    text-align: center;
    padding: 60px 0;
    color: #F09595;
    font-size: 14px;
  }

  #error-state strong {
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
    color: #F7C1C1;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 14px 48px;
    border-top: 1px solid var(--border);
    background: rgba(0,21,51,0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    font-weight: 300;
  }

  #refresh-btn {
    background: rgba(0,79,163,0.3);
    border: 1px solid rgba(0,79,163,0.5);
    color: var(--ks-white);
    padding: 6px 16px;
    border-radius: 99px;
    font-family: 'Lexend', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.05em;
  }

  #refresh-btn:hover { background: rgba(0,79,163,0.55); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-titles">
    <h2>Kōnane Leaderboard</h2>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span>Live</div>
    <div id="last-updated">Fetching data…</div>
  </div>
</header>

<div id="loading-state">
  <div class="spinner"></div>
  Loading leaderboard…
</div>

<div id="error-state">
  <strong>Could not load leaderboard data</strong>
  Check your connection or verify the spreadsheet is published publicly.
</div>

<div id="content" class="hidden">
  <div class="table-section">
    <table class="lb-table">
      <thead>
        <tr>
          <th class="center">Rank</th>
          <th>Inoa</th>
          <th class="right">Record</th>
        </tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
  </div>
</div>

<footer>
  <span></span>
  <button id="refresh-btn">↺ Refresh</button>
</footer>

<script>
const SHEET_ID = '1CWtdB_1y4bSB9yZgXFqTV1yB_TKbzXcBKLIR7ANXPO4';
const GID = '319645049';

const COL_NAME   = 0;
const COL_WINS   = 1;
const COL_LOSSES = 2;
const COL_RECORD = 3;

function formatTime(d) {
  return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', second:'2-digit' });
}

// Assign a tier 1–5 based on where a player's wins fall in the distribution
function assignTiers(rows) {
  if (!rows.length) return [];

  const scores = rows.map(r => parseFloat(String(r[COL_WINS])) || 0);
  const max = Math.max(...scores);
  const min = Math.min(...scores);
  const range = max - min;

  return rows.map((row, i) => {
    const wins = scores[i];
    // Normalize 0–1 within the field's range
    const norm = range > 0 ? (wins - min) / range : 1;

    let tier;
    if (norm >= 0.90)      tier = 1;
    else if (norm >= 0.70) tier = 2;
    else if (norm >= 0.45) tier = 3;
    else if (norm >= 0.20) tier = 4;
    else                   tier = 5;

    return { row, tier, wins };
  });
}

function recordClass(wins, losses) {
  if (losses === 0 && wins > 0) return 'undefeated';
  if (wins > losses) return 'winning';
  if (wins === losses) return 'even';
  return 'losing';
}

function buildTable(rows) {
  const tiered = assignTiers(rows);
  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = '';

  // Banzuke tier-style: rank = number of distinct record tiers above you + 1
  const rankMap = [];
  let tierRank = 1;
  tiered.forEach(({ row }, i) => {
    if (i === 0) {
      rankMap.push(tierRank);
    } else {
      const prev = tiered[i - 1].row;
      const sameWins   = (parseFloat(String(row[COL_WINS]))   || 0) === (parseFloat(String(prev[COL_WINS]))   || 0);
      const sameLosses = (parseFloat(String(row[COL_LOSSES])) || 0) === (parseFloat(String(prev[COL_LOSSES])) || 0);
      if (!sameWins || !sameLosses) tierRank++; // new distinct tier
      rankMap.push(tierRank);
    }
  });

  tiered.forEach(({ row, tier }, i) => {
    const rank = rankMap[i];
    const wins   = parseFloat(String(row[COL_WINS]))   || 0;
    const losses = parseFloat(String(row[COL_LOSSES])) || 0;
    const recClass = recordClass(wins, losses);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="center rank-cell">${rank}</td>
      <td class="name-cell tier-${tier}">${row[COL_NAME]}</td>
      <td class="right record-cell ${recClass}">${row[COL_RECORD]}</td>
    `;
    tbody.appendChild(tr);
  });
}

function showError(msg) {
  document.getElementById('loading-state').classList.add('hidden');
  const error = document.getElementById('error-state');
  error.style.display = 'block';
  error.innerHTML = `<strong>Could not load leaderboard data</strong>${msg}`;
  document.getElementById('last-updated').textContent = 'Last attempt: ' + formatTime(new Date());
}

function loadLeaderboard() {
  const loading = document.getElementById('loading-state');
  const error   = document.getElementById('error-state');
  const content = document.getElementById('content');
  const updated = document.getElementById('last-updated');

  loading.classList.remove('hidden');
  error.style.display = 'none';
  content.classList.add('hidden');

  const cbName = 'gsCallback_' + Date.now();

  const timer = setTimeout(() => {
    delete window[cbName];
    showError('Request timed out. Check that the sheet is published publicly.');
  }, 10000);

  window[cbName] = function(response) {
    clearTimeout(timer);
    delete window[cbName];
    try {
      if (response.status === 'error') throw new Error(response.errors?.[0]?.detailed_message || 'Sheet error');

      const rows = response.table.rows
        .map(r => r.c.map(cell => cell ? (cell.f !== undefined ? cell.f : cell.v) : ''))
        .filter(r => r[COL_NAME] && String(r[COL_NAME]).trim() !== '');

      // Sort: most wins first; on tie, fewer losses first; otherwise preserve sheet order
      rows.sort((a, b) => {
        const aw = parseFloat(String(a[COL_WINS]))   || 0;
        const bw = parseFloat(String(b[COL_WINS]))   || 0;
        if (bw !== aw) return bw - aw;
        const al = parseFloat(String(a[COL_LOSSES])) || 0;
        const bl = parseFloat(String(b[COL_LOSSES])) || 0;
        return al - bl;
      });

      buildTable(rows);

      loading.classList.add('hidden');
      content.classList.remove('hidden');
      updated.textContent = 'Updated ' + formatTime(new Date());
    } catch(e) {
      showError(e.message);
    }
  };

  const script = document.createElement('script');
  script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json;responseHandler:${cbName}`;
  script.onerror = () => { clearTimeout(timer); showError('Failed to reach Google Sheets.'); };
  document.head.appendChild(script);
}

document.getElementById('refresh-btn').addEventListener('click', loadLeaderboard);
loadLeaderboard();
setInterval(loadLeaderboard, 60000);
</script>
</body>
</html>
